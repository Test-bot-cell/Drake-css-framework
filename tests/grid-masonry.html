<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Grid Masonry - Drake tests</title>
        <script src="../dist/js/tests/test.js"></script>
        <style>

            :nth-child(9n-8) > .drk-panel { height: 140px; background: rgba(0,0,0,0.1); }
            :nth-child(9n-7) > .drk-panel { height: 180px; background: rgba(0,0,0,0.1); }
            :nth-child(9n-6) > .drk-panel { height: 220px; background: rgba(0,0,0,0.1); }
            :nth-child(9n-5) > .drk-panel { height: 280px; background: rgba(0,0,0,0.15); }
            :nth-child(9n-4) > .drk-panel { height: 140px; background: rgba(0,0,0,0.2); }
            :nth-child(9n-3) > .drk-panel { height: 200px; background: rgba(0,0,0,0.25); }
            :nth-child(9n-2) > .drk-panel { height: 250px; background: rgba(0,0,0,0.3); }
            :nth-child(9n-1) > .drk-panel { height: 320px; background: rgba(0,0,0,0.35); }
            :nth-child(9n) > .drk-panel { height: 160px; background: rgba(0,0,0,0.35); }

        </style>
    </head>

    <body>

        <div class="drk-container">

            <h1>Grid Masonry</h1>

            <div class="drk-margin">
                <select id="js-masonry-switcher" class="drk-select drk-form-width-small" aria-label="Masonry switcher">
                    <option value="pack">Pack</option>
                    <option value="next">Next</option>
                </select>
            </div>

            <div class="drk-child-width-1-2@s drk-child-width-1-3@m drk-child-width-1-4@l drk-light js-grid-masonry" drk-grid masonry="pack">
                <div><div class="drk-panel"><h1 class="drk-position-center">1</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">2</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">3</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">4</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">5</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">6</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">7</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">8</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">9</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">10</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">11</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">12</h1></div></div>
            </div>

            <h2>With Parallax</h2>

            <div class="drk-child-width-1-2@s drk-child-width-1-3@m drk-child-width-1-4@l drk-light js-grid-masonry" drk-grid="parallax: 150" masonry="pack">
                <div><div class="drk-panel"><h1 class="drk-position-center">1</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">2</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">3</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">4</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">5</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">6</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">7</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">8</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">9</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">10</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">11</h1></div></div>
                <div><div class="drk-panel"><h1 class="drk-position-center">12</h1></div></div>
            </div>

        </div>


    </body>
</html>
