<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Background - Drake tests</title>
        <script src="../dist/js/tests/test.js"></script>
    </head>

    <body>

        <div class="drk-container">

            <h1>Background</h1>

            <h2>Color, Position, No Repeat, Image</h2>

            <div class="drk-child-width-1-4" drk-grid>
                <div>

                    <div class="drk-background-norepeat drk-background-image@s drk-background-default drk-background-top-left drk-padding drk-flex drk-flex-center drk-flex-middle drk-text-center" style="background-image: url('images/photo.jpg'); background-size: 60px 40px;">Default<br>Top Left<br>S</div>

                </div>
                <div>

                    <div class="drk-background-norepeat drk-background-image@m drk-background-muted drk-background-top-right drk-padding drk-flex drk-flex-center drk-flex-middle drk-text-center" style="background-image: url('images/photo.jpg'); background-size: 60px 40px;">Muted<br>Top Right<br>M</div>

                </div>
                <div>

                    <div class="drk-background-norepeat drk-background-image@l drk-background-primary drk-background-bottom-left drk-padding drk-flex drk-flex-center drk-flex-middle drk-text-center" style="background-image: url('images/photo.jpg'); background-size: 60px 40px;">Primary<br>Bottom Left<br>L</div>

                </div>
                <div>

                    <div class="drk-background-norepeat drk-background-image@xl drk-background-secondary drk-background-bottom-right drk-padding drk-flex drk-flex-center drk-flex-middle drk-text-center" style="background-image: url('images/photo.jpg'); background-size: 60px 40px;">Secondary<br>Bottom Right<br>XL</div>

                </div>
            </div>

            <h2>Cover</h2>

            <div class="drk-child-width-1-2@s" drk-grid>
                <div>

                    <div class="drk-background-cover drk-flex drk-flex-center drk-flex-middle drk-light" style="height: 300px; background-image: url('images/photo.jpg');">
                        <h1 class="drk-heading-large">Fixed Height</h1>
                    </div>

                </div>
                <div>

                    <div class="drk-background-cover drk-position-relative drk-light" style="background-image: url('images/photo.jpg');">
                        <img class="drk-invisible" src="images/photo.jpg" alt="">
                        <div class="drk-position-cover drk-flex drk-flex-center drk-flex-middle">
                            <h1>Responsive Height</h1>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </body>
</html>
