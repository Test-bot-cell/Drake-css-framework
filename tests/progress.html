<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Progress - Drake tests</title>
        <script src="../dist/js/tests/test.js"></script>
    </head>

    <body>

        <div class="drk-container">

            <h1>Progress</h1>

            <div class="drk-width-1-2@m">

                <p>Indeterminate</p>
                <progress class="drk-progress"></progress>

                <p>Determinate</p>
                <progress class="drk-progress" value="40" max="100"></progress>

                <p>With Text</p>
                <progress class="drk-progress" value="45" max="100">45%</progress>

                <p>100%</p>
                <progress class="drk-progress" value="100" max="100"></progress>

                <p>Updating</p>
                <progress id="js-progressbar" class="drk-progress" max="100"></progress>

            </div>

        </div>


    </body>
</html>
