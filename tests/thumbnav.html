<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Thumbnav - Drake tests</title>
        <script src="../dist/js/tests/test.js"></script>
    </head>

    <body>

        <div class="drk-container">

            <h1>Thumbnav</h1>

            <h2>Horizontal</h2>

            <ul class="drk-thumbnav">
                <li class="drk-active"><a href="#"><img src="images/photo.jpg" width="100" height="67" alt=""></a></li>
                <li><a href="#"><img src="images/dark.jpg" width="100" height="67" alt=""></a></li>
                <li><a href="#"><img src="images/light.jpg" width="100" height="67" alt=""></a></li>
            </ul>

            <h2>Vertical</h2>

            <ul class="drk-thumbnav drk-thumbnav-vertical">
                <li class="drk-active"><a href="#"><img src="images/photo.jpg" width="100" height="67" alt=""></a></li>
                <li><a href="#"><img src="images/dark.jpg" width="100" height="67" alt=""></a></li>
                <li><a href="#"><img src="images/light.jpg" width="100" height="67" alt=""></a></li>
            </ul>

            <h2>Image</h2>

            <div class="drk-position-relative" drk-slideshow="animation: fade">

                <div class="drk-slideshow-items">
                    <div><img src="images/photo.jpg" width="1800" height="1200" alt="" drk-cover></div>
                    <div><img src="images/dark.jpg" width="1800" height="1200" alt="" drk-cover></div>
                    <div><img src="images/light.jpg" width="1800" height="1200" alt="" drk-cover></div>
                </div>

                <div class="drk-position-bottom-center drk-position-small">
                    <ul class="drk-slideshow-nav drk-thumbnav">
                        <li drk-slideshow-item="0"><a href><img src="images/photo.jpg" width="100" height="67" alt=""></a></li>
                        <li drk-slideshow-item="1"><a href><img src="images/dark.jpg" width="100" height="67" alt=""></a></li>
                        <li drk-slideshow-item="2"><a href><img src="images/light.jpg" width="100" height="67" alt=""></a></li>
                    </ul>
                </div>

                <div class="drk-position-center-right drk-position-small">
                    <ul class="drk-slideshow-nav drk-thumbnav drk-thumbnav-vertical">
                        <li drk-slideshow-item="0"><a href><img src="images/photo.jpg" width="100" height="67" alt=""></a></li>
                        <li drk-slideshow-item="1"><a href><img src="images/dark.jpg" width="100" height="67" alt=""></a></li>
                        <li drk-slideshow-item="2"><a href><img src="images/light.jpg" width="100" height="67" alt=""></a></li>
                    </ul>
                </div>

            </div>

        </div>

    </body>
</html>
