<!DOCTYPE html>
<html lang="en-gb" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Grid Parallax - Drake tests</title>
        <script src="../dist/js/tests/test.js"></script>
        <style>

            .drk-panel { height: 300px; }

            :nth-child(5n-4) > .drk-panel { background: rgba(0,0,0,0.2); }
            :nth-child(5n-3) > .drk-panel { background: rgba(0,0,0,0.3); }
            :nth-child(5n-2) > .drk-panel { background: rgba(0,0,0,0.4); }
            :nth-child(5n-1) > .drk-panel { background: rgba(0,0,0,0.5); }
            :nth-child(5n) > .drk-panel { background: rgba(0,0,0,0.6); }

            .test { background: rgba(0,0,0,0.05); }

            .js-grid-parallax :nth-child(9n-8) > .drk-panel { height: 240px; background: rgba(0,0,0,0.1); }
            .js-grid-parallax :nth-child(9n-7) > .drk-panel { height: 380px; background: rgba(0,0,0,0.1); }
            .js-grid-parallax :nth-child(9n-6) > .drk-panel { height: 400px; background: rgba(0,0,0,0.1); }
            .js-grid-parallax :nth-child(9n-5) > .drk-panel { height: 480px; background: rgba(0,0,0,0.15); }
            .js-grid-parallax :nth-child(9n-4) > .drk-panel { height: 260px; background: rgba(0,0,0,0.2); }
            .js-grid-parallax :nth-child(9n-3) > .drk-panel { height: 400px; background: rgba(0,0,0,0.25); }
            .js-grid-parallax :nth-child(9n-2) > .drk-panel { height: 450px; background: rgba(0,0,0,0.3); }
            .js-grid-parallax :nth-child(9n-1) > .drk-panel { height: 520px; background: rgba(0,0,0,0.35); }
            .js-grid-parallax :nth-child(9n) > .drk-panel { height: 280px; background: rgba(0,0,0,0.35); }

        </style>
    </head>

    <body>

        <div class="drk-container">

            <h1>Grid Parallax</h1>

            <h2>3 Columns</h2>

            <div class="test">
                <div class="drk-child-width-1-3@m" drk-grid="parallax: 150">
                    <div>

                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>

                    </div>
                    <div>

                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>

                    </div>
                    <div>

                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>
                        <div class="drk-panel drk-grid-margin"></div>

                    </div>
                </div>
            </div>

            <h2>Multi-row</h2>

            <div class="test">
                <div class="drk-child-width-1-2@ drk-child-width-1-3@m drk-child-width-1-3@l" drk-grid="parallax: 150">
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                    <div><div class="drk-panel"></div></div>
                </div>
            </div>

            <h2>With Masonry</h2>

            <div class="drk-margin drk-form-stacked">
                <div class="drk-inline">
                    <label class="drk-form-label" for="js-parallax-switcher">Parallax</label>
                    <input id="js-parallax-switcher" class="drk-input drk-form-width-small" type="text" value="0">
                </div>
                <div class="drk-inline">
                    <label class="drk-form-label" for="js-parallax-start-switcher">Start</label>
                    <input id="js-parallax-start-switcher" class="drk-input drk-form-width-small" type="text" value="0">
                </div>
                <div class="drk-inline">
                    <label class="drk-form-label" for="js-parallax-end-switcher">End</label>
                    <input id="js-parallax-end-switcher" class="drk-input drk-form-width-small" type="text" value="0">
                </div>
                <div class="drk-inline">
                    <label class="drk-form-label" for="js-parallax-justify-switcher">Justify</label>
                    <select id="js-parallax-justify-switcher" class="drk-select drk-form-width-small">
                        <option value="false">False</option>
                        <option value="true" selected>True</option>
                    </select>
                </div>
                <div class="drk-inline">
                    <label class="drk-form-label" for="js-masonry-switcher">Masonry</label>
                    <select id="js-masonry-switcher" class="drk-select drk-form-width-small">
                        <option value="pack">Pack</option>
                        <option value="next">Next</option>
                    </select>
                </div>
            </div>

            <div class="test" style="margin-bottom: 100vh">
                <div class="drk-child-width-1-2@s drk-child-width-1-3@m drk-child-width-1-4@l drk-light js-grid-parallax" drk-grid parallax="0" parallax-justify="true" masonry="pack">
                    <div><div class="drk-panel"><h1 class="drk-position-center">1</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">2</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">3</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">4</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">5</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">6</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">7</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">8</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">9</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">10</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">11</h1></div></div>
                    <div><div class="drk-panel"><h1 class="drk-position-center">12</h1></div></div>
                </div>
            </div>

        </div>


    </body>
</html>
